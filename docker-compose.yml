# Local development database. Run: docker compose up -d
# Creates two databases: spartan_hangout (development) and spartan_hangout_test (tests).
services:
  postgres:
    image: postgres:17-alpine
    container_name: spartan-hangout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spartan
      POSTGRES_PASSWORD: spartan
      POSTGRES_DB: spartan_hangout
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spartan -d spartan_hangout']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
