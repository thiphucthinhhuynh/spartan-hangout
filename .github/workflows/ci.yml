name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        # Keep in sync with docker-compose.yml
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spartan
          POSTGRES_PASSWORD: spartan
          POSTGRES_DB: spartan_hangout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spartan -d spartan_hangout_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://spartan:spartan@localhost:5432/spartan_hangout_test
      DATABASE_URL_TEST: postgresql://spartan:spartan@localhost:5432/spartan_hangout_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate code (shared package build + Prisma client)
        run: npm run codegen

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The API test setup applies migrations to the test database first (apps/api/test/globalSetup.ts).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
